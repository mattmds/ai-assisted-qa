name: Cucumber

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  cucumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Rodar Cucumber
        id: cucumber
        continue-on-error: true
        env:
          HEADLESS: "true"
        run: bundle exec cucumber -p ci

      - name: Publicar relatório e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports
          path: |
            results.json
            reports/
          if-no-files-found: ignore

      - name: Analisar falhas com IA (somente em PRs)
        if: steps.cucumber.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: ruby scripts/analyze_failure.rb results.json

      - name: Falhar o job se os testes falharam
        if: steps.cucumber.outcome == 'failure'
        run: exit 1
